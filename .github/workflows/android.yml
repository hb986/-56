name: Build Android APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle and available original audio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/raw app/src/main/res/drawable-nodpi
          sounds=(zabo_kebir batandora_elhamra fokhany wahed sayek betengany_adim maleh zabri_manga almani)
          copied=0
          for name in "${sounds[@]}"; do
            if [ -f "${name}.mp3" ]; then
              cp "${name}.mp3" "app/src/main/res/raw/${name}.mp3"
              echo "Added original audio: ${name}.mp3"
              copied=$((copied + 1))
            else
              echo "::warning::Optional audio missing: ${name}.mp3 — app will build without this button"
            fi
          done
          if [ "$copied" -eq 0 ]; then
            echo "::error::No MP3 audio files were found in the repository root."
            exit 1
          fi
          if [ -f frog.jpg ]; then
            cp frog.jpg app/src/main/res/drawable-nodpi/frog.jpg
          else
            echo "::warning::frog.jpg is missing; app will use its built-in frog emoji header"
          fi

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Antel-ElMahalla-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
