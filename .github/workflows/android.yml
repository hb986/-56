name: Build Android APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle and cache dependencies
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Install original audio and app icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/raw app/src/main/res/drawable-nodpi
          required=(zabo_kebir batandora_elhamra fokhany wahed sayek betengany_adim maleh zabri_manga almani)
          missing=0
          for name in "${required[@]}"; do
            if [ ! -f "${name}.mp3" ]; then
              echo "::error::Missing original audio file: ${name}.mp3 (upload it to the repository root)"
              missing=1
            else
              cp "${name}.mp3" "app/src/main/res/raw/${name}.mp3"
            fi
          done
          if [ ! -f frog.jpg ]; then
            echo "::error::Missing frog.jpg app icon (upload it to the repository root)"
            missing=1
          else
            cp frog.jpg app/src/main/res/drawable-nodpi/frog.jpg
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Antel-ElMahalla-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
